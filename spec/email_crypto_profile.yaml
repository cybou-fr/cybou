version: '0.0.1'
status: dev_crypto_and_mail_envelope_frozen_backend_pending
native_email:
  e2e_required: true
  plaintext_fallback: false
  smtp_required: false
mail_semantics:
  recipient_accounts_per_message: 1
  content_type: text_only
  attachments: false
  recipient_identity_capability: one_current_account_key_epoch
  mainnet_enabled: false
content:
  cek:
    algorithm: random
    length_bytes: 32
  encrypt_once: true
  aead: ChaCha20-Poly1305
  nonce:
    algorithm: random
    length_bytes: 12
  protected_plaintext: canonical_text_mail
recipient_key_wrap:
  mechanism: HPKE
  mode: base
  standard_basis: RFC 9180
  dev_profile:
    hpke_spec: draft-ietf-hpke-pq-05
    kem: MLKEM768-X25519
    kem_id: 0x647a
    kdf: HKDF-SHA256
    kdf_id: 0x0001
    aead: ChaCha20-Poly1305
    aead_id: 0x0003
  encapsulation: one_context_per_recipient_account_key_epoch
  plaintext: 32_byte_cek
  pq_basis: NIST FIPS 203 ML-KEM-768
  status: frozen_for_dev_only
  custom_hybrid_combiner: false
authentication:
  sender_signature_separate_from_hpke: true
  sender_authorization: identity_ed25519_and_ml_dsa_44
  signed_value: canonical_mail_payload_commitment
privacy:
  subject_inside_ciphertext: true
  body_inside_ciphertext: true
  thread_metadata_inside_ciphertext_where_possible: true
  recipient_account_id_public_in_current_mailtx: true
  discovery_tag: sha256_domain_network_recipient_account
  discovery_tag_is_privacy_mechanism: false
  recipient_relationship_privacy_claim: false
  dev_metadata_leakage_accepted: true
  mainnet_requires_separate_privacy_review: true
content_commitment:
  algorithm: SHA-256
  salted: true
  salt_length_bytes: 32
  domain_separator_ascii: CYBOU/MAIL_COMMIT/V2
  input: domain_separator || salt || canonical_protected_plaintext
  salt_location: inside_encrypted_protected_plaintext
  bare_plaintext_hash: false
wire_profile:
  status: frozen_for_dev_only
  envelope_version: 1
  envelope_location: existing_mail_payload_ciphertext
  integer_encoding: little_endian_except_hpke_suite_ids
  hpke_suite_id_encoding: three_u16_big_endian_kem_kdf_aead
  mail_id: random_32_bytes
  recipient_snapshot: finalized_height_and_state_root
  capsule_count: exactly_one
  capsule_order: none
  capsule_encoding: recipient_key_epoch_u64le_package_commitment_32_enc_1120_wrapped_cek_48
  hpke_info: CYBOU/MAIL/CEK-WRAP/V1_plus_bound_context
  hpke_aad: empty
  content_aad: CYBOU/MAIL/CONTENT/V1_plus_bound_context
  protected_text_encoding: version_sender_account_recipient_account_created_time_subject_utf8_body_utf8
  max_subject_bytes: 256
  max_body_bytes: 48000
  invalid_utf8: reject
  compression: false
  threads: false
  discovery_tag_derivation: CYBOU/MAIL/DISCOVERY/V1_plus_network_id_plus_recipient_account_id_sha256
  historical_sender_key_evidence: required_off_wire_for_receive
  max_ciphertext_bytes_dev: 65536
  max_authorized_mail_bytes_before_operation_type_dev: 68234
  fee_dev: base_4_plus_1_per_1024_ciphertext_bytes_rounded_up
  priority_fee: disabled
  enable_send_or_decrypt: false
implementation:
  native_envelope_v1_codec: implemented
  native_protected_text_v1_codec: implemented
  hpke_encryption_backend_integrated: false
  repository_backend_dependency: OpenSSL_3_5
  openssl_3_5_hpke_api_supports_xwing_kem_id_0x647a: false
  alternate_vetted_backend_selected: false
mainnet:
  enabled: false
  requires_final_standards: true
