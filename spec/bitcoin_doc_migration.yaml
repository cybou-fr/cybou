schema_version: '1'
reference_upstream:
  project: Bitcoin Core
  reference_tag: v31.1
  note: Reconcile against the exact local Bitcoin Core copy before applying deletions.
actions:
  keep: Retain; CYBOU naming-only edits may still apply.
  adapt: Retain subject and implementation guidance but rewrite CYBOU assumptions.
  transitional: Valid only while inherited subsystem remains materially Bitcoin-like.
  replace: CYBOU document becomes authoritative.
  archive: Historical/upstream reference only; exclude from active product docs.
  remove: Remove from active tree/package when corresponding feature/code is removed.
  keep-license: Preserve required license/copyright notices.
root:
- path: README.md
  action: replace
  stage: now
  replacement: CYBOU README
- path: INSTALL.md
  action: adapt
  stage: v0.0.x
  replacement: CYBOU build/install guide
- path: CONTRIBUTING.md
  action: replace
  stage: before public contributions
  replacement: CYBOU contribution policy
- path: SECURITY.md
  action: replace
  stage: before public releases
  replacement: CYBOU security reporting policy
- path: COPYING
  action: keep-license
  stage: always
  replacement: null
