schema_version: '1'
reference_upstream:
  project: Bitcoin Core
  reference_tag: v31.1
  note: Reconcile against the exact local Bitcoin Core copy before applying deletions.
authority:
  baseline: spec/cybou_baseline.yaml
  doc_map: spec/bitcoin_doc_migration.yaml
actions:
  keep: Retain; still consensus-critical or CYBOU-repurposed.
  remove: Delete from active tree; no CYBOU replacement required.
  replace: Delete only together with landing the named CYBOU replacement.
  transitional: Valid only while inherited subsystem remains materially Bitcoin-like; do not delete yet.
  adapt: Retain subject, rewrite to CYBOU parameters.
stages:
  now: No CYBOU replacement required; deletions are safe against current specs.
  with_cybou_reward_router: Land together with CYBOU emission/reward implementation.
  with_cybou_identity_wallet: Land together with CYBOU Wallet/Identity application.
  bft_block_production: Land when BFT validator block production replaces inherited mining.
  pq_crypto: Land when post-quantum signature path replaces inherited script validation.
  mempool_p2p_review: Land as a packaged mempool/P2P policy review.
  v0.0.4: Planned migration window per bitcoin_doc_migration.yaml.

# ---------------------------------------------------------------------------
# Tier 1 — removable now. Specs explicitly forbid the Bitcoin functionality and
# the code is dead or non-consensus. Covers all 5 currently failing inherited
# unit tests (4x pow_tests, 1x net_peer_connection_tests).
# ---------------------------------------------------------------------------
networks:
- path: src/kernel/chainparams.cpp (CTestNetParams, CTestNet4Params, CSignetParams, CRegTestParams)
  action: remove
  stage: now
  reason: bitcoin_network_access_in_cybou_build forbidden; CMainParams is already CYBOU-DEV (port 29444); testnet 18333 / testnet4 48333 / signet 38333 classes are dead.
- path: src/util/chaintype.h, src/util/chaintype.cpp (ChainType TESTNET/SIGNET/REGTEST/TESTNET4)
  action: remove
  stage: now
  reason: ChainType collapses to MAIN (CYBOU-DEV); string table entries for Bitcoin networks go with the classes.
- path: src/chainparamsbase.cpp, src/chainparamsbase.h
  action: adapt
  stage: now
  reason: Drop base params/data dirs for testnet/signet/regtest; keep single CYBOU-DEV base.
- path: src/chainparams.cpp (CreateChainParams switch, ReadSigNetArgs, ReadRegTestArgs)
  action: remove
  stage: now
  reason: -signetchallenge/-signetseednode/-vbparams/-testactivationheight are Bitcoin-network plumbing; collapse to CChainParams::Main().
- path: src/chainparamsseeds.h
  action: remove
  stage: now
  reason: pnSeed6_* arrays unused; CYBOU-DEV clears vSeeds and configures peers explicitly.

interfaces:
- path: src/rest.cpp
  action: remove
  stage: now
  reason: application_api.rest=false and localhost_http=false in baseline; doc/man/rest doc removal follows bitcoin_doc_migration.yaml.
- path: src/policy/fees/ (block_policy_estimator.*, block_policy_estimator_args.*)
  action: replace/transitional
  stage: with_cybou_identity_wallet
  reason: priority_fee_v1=false and fee_bidding_v1=false, but the inherited wallet/Qt path still links the estimator; remove it with the CYBOU-native account wallet rather than breaking the transitional client.
- path: src/rpc/fees.cpp
  action: remove
  stage: now
  reason: estimatesmartfee/estimaterawfee serve fee bidding only; goes with the estimator.
- path: src/zmq/
  action: remove
  stage: now
  reason: WITH_ZMQ already OFF by default and code is ifdef-isolated; doc/zmq.md removal per bitcoin_doc_migration.yaml.

tests:
- path: src/test/pow_tests.cpp
  action: remove
  stage: now
  reason: 4 failing tests assume Bitcoin PoW retargeting; CYBOU-DEV sets fPowNoRetargeting and PoT replaces difficulty semantics. Not applicable.
- path: src/test/testnet4_miner_tests.cpp
  action: remove
  stage: now
  reason: Testnet4 is a forbidden Bitcoin network; goes with the chainparams classes.
- path: src/test/net_peer_connection_tests.cpp (8333 expectations)
  action: adapt
  stage: now
  reason: ASSERT_DEBUG_LOG expects port 8333; CYBOU-DEV default port is 29444. Rewrite to CYBOU port.
- path: test/functional/ (273 Bitcoin scenario files)
  action: remove
  stage: now
  reason: No CYBOU functional tests exist; rpc/wallet/p2p/mining scenarios assume disabled RPC, excluded wallet, and forbidden Bitcoin networks. Keep framework scaffolding for future CYBOU scenarios.

docs:
- path: doc/bips.md
  action: archive
  stage: now
  reason: Chain divergence already happened (CYBOU-DEV genesis); per bitcoin_doc_migration.yaml archive stage 'after CYBOU chain divergence'.
- path: doc/release-notes/*
  action: archive
  stage: now
  reason: Bitcoin Core release history; per bitcoin_doc_migration.yaml stage 'early cleanup'.
- path: doc/man/*
  action: remove
  stage: now
  reason: Bitcoin binary manpages; per bitcoin_doc_migration.yaml removed as Bitcoin binaries are removed from active packaging.

# ---------------------------------------------------------------------------
# Tier 2 — removable only together with the named CYBOU replacement.
# ---------------------------------------------------------------------------
with_replacement:
- path: src/validation.cpp GetBlockSubsidy(), src/validation.h, consensus/params.h nSubsidyHalvingInterval
  action: replace
  stage: with_cybou_reward_router
  reason: 50*COIN halving schedule is Bitcoin monetary policy; CYBOU model is fixed emission + fee router (3 security + 1 onboarding per batch) + validator equal-split rewards per spec/fee_router.yaml and spec/reward_policy.yaml.
- path: src/wallet/
  action: replace
  stage: with_cybou_identity_wallet
  reason: Inherited Bitcoin wallet already FORCE-excluded from CYBOU_CONSUMER_BUILD; deleted when CYBOU Wallet/Identity lands. Drags along base58/bech32/blockfilter rescan dependencies when no other consumer remains.
- path: bitcoin-cli, bitcoin-tx, bitcoin-util executables (src/CMakeLists.txt)
  action: remove
  stage: now
  reason: Dev-profile only; public CYBOU binary is cybou.exe. Keep test_bitcoin. Remove with doc/man entries above.
- path: src/qt/ payment/wallet UI (send/receive dialogs, payment server, qrencode)
  action: replace
  stage: with_cybou_identity_wallet
  reason: Payment UI assumes inherited wallet and URIs; replaced by CYBOU Wallet/Identity and Mail UI.

# ---------------------------------------------------------------------------
# Tier 3 — transitional. Do NOT delete yet; revisit at the named gate.
# ---------------------------------------------------------------------------
transitional:
- path: src/script/ + versionbits machinery (src/versionbits.cpp, deploymentinfo, DeploymentActive* call sites in validation.cpp)
  action: transitional
  stage: pq_crypto
  reason: DERSIG/CLTV/CSV/SEGWIT/TAPROOT activation checks are still consensus-active; deletion requires the post-quantum signature decision (HYBRID_ED25519_MLDSA65_V1 verification lands v0.0.3.2).
- path: src/node/miner.cpp, src/rpc/mining.cpp, src/node/mini_miner.cpp
  action: transitional
  stage: bft_block_production
  reason: CYBOU-DEV still produces blocks through inherited mining; removed when BFT validator block production exists.
- path: policy/rbf.cpp, policy/truc_policy.*, policy/ephemeral_policy.*, policy/packages.*
  action: transitional
  stage: mempool_p2p_review
  reason: RBF/TRUC/package relay are Bitcoin fee-bidding mempool policy; CYBOU v1 has a single first-class MailTx op. Remove as one packaged mempool review.
- path: src/node/txorphanage.*, src/node/txdownloadman*, src/node/txreconciliation.*, src/node/minisketchwrapper.*
  action: transitional
  stage: mempool_p2p_review
  reason: Orphan handling, tx download scheduling, and Erlay reconciliation assume open Bitcoin relay; reviewed with P2P policy pass.
- path: src/bip324.*, src/addrman*, src/banman.*, src/addrdb.*
  action: transitional
  stage: mempool_p2p_review
  reason: Transport and peer-management layer; CYBOU sovereign network may replace admission model (operator-approved validators) before pruning.
- path: src/node/utxo_snapshot.*, assumeutxo code paths
  action: transitional
  stage: v0.0.4
  reason: Replaced by CYBOU bounded-history bootstrap/checkpoint policy per bitcoin_doc_migration.yaml.
- path: multiprocess IPC (src/ipc/, ENABLE_IPC)
  action: transitional
  stage: mempool_p2p_review
  reason: Already OFF in consumer build and on Windows; low value, delete opportunistically with P2P review.
