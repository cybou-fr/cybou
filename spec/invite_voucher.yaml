version: '0.14'
welcome_grant: 6000
asset: CYBOU
source: OnboardingPool
destination: SystemBalance
automatic_on_identity_creation: false
voucher:
  required: true
  one_time: true
  operator_authority_signature: true
  bearer_voucher: false
  canonical_signed_payload: FROZEN_V0_0_3_1
  object_signing_domain: CYBOU/SIG/INVITE-VOUCHER/V1
  signature_suite: HYBRID_ED25519_MLDSA65_V1
  signature_suite_rule: BOTH_SIGNATURES_REQUIRED_AND
  signature_sizes:
    ed25519: 64
    mldsa65: 3309
  authority_keyset:
    keyset_id: hash32
    ed25519_public_key_bytes: 32
    mldsa65_public_key_bytes: 1952
    epoch_window: active_from_inclusive_retired_from_exclusive
  payload_encoding:
    description: >-
      Signed message is object_signing_domain || signature_suite_id_le16 ||
      authority_keyset_id || canonical_payload. canonical_payload is a
      fixed-layout byte string: one version byte, three 32-byte hashes
      in internal byte order, uint64 little-endian, one presence flag byte,
      optional 32-byte organization_id. No dynamic-length fields.
    layout:
    - field: payload_version
      type: uint8
      must_equal: 1
    - field: network_id
      type: hash32
      semantics: genesis_block_hash
    - field: voucher_id
      type: hash32
    - field: beneficiary_account_id
      type: hash32
    - field: grant_amount
      type: uint64_le
      must_equal: 6000
    - field: expiry_epoch
      type: uint64_le
    - field: organization_present
      type: uint8
      values: [0, 1]
    - field: organization_id
      type: hash32
      present_if: organization_present == 1
    size_bytes: [114, 146]
  fields:
  - payload_version
  - network_id
  - voucher_id
  - beneficiary_account_id
  - grant_amount
  - expiry_epoch
  - optional_organization_id
  - operator_authority_signature
  replay_protection: consensus_consumed_voucher_id
  redemption:
    atomic: true
    debit: OnboardingPool
    credit: beneficiary.SystemBalance
    amount: 6000
    failure_mutates_state: false
    persistent_record: consumed_voucher_id_only
    state_encoding: CYBOU/STATE/INVITE-REDEMPTION/V1
    state_hash: domain_separated_sha256
    bootstrap_persistence:
      backend: LevelDB
      write: synchronous_atomic_batch
      records: [canonical_state, state_hash]
      load_requires_hash_match: true
      final_block_integration: pending
  crypto_verification_status: TYPED_VERIFIER_BOUNDARY_PROVIDER_PENDING
