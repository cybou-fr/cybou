version: '0.0.1'
operation_type: MailTx
first_class_protocol_operation: true
encoded_as_op_return: false
initial_profile:
  one_recipient: true
  text_only: true
  attachments: false
  priority_fee: false
  size_aware_fee: true
  max_serialized_size: OPEN_BENCHMARK_REQUIRED
history:
  full_ciphertext_in_block_data_before_store: true
  per_mail_permanent_consensus_state: false
  desktop_pruning_allowed: true
  active_validator_prestore_archival_required: true
discovery:
  recipient_tag: OPEN_PRIVACY_DESIGN
  block_or_range_filter: PREFERRED
evidence:
  export_bundle: true
  historical_sender_key_state_proof: true
  salted_content_commitment: true
  bare_plaintext_hash: false
beta_attachments:
  enabled_after_storage_and_mail_gates: true
  beta_recipient_count: OPEN_BETA_LIMIT
  recipient_capsule: one_per_recipient_AccountID_and_key_epoch
  attachment_bytes_in_mail_tx: false
  attachment_transport: encrypted_object_layer
  descriptor_in_e2e_protected_message: true
  descriptor_fields:
    - object_id
    - manifest_commitment
    - encrypted_size
    - logical_size
    - display_name
    - mime_type
    - independent_object_key
  object_manifest_and_chunk_topology_in_mail_tx: false
  send_waits_for_storage_durability: true
  maximum_attachment_count: OPEN_BENCHMARK_REQUIRED
  status: target_architecture_not_current_DEV_profile
message_content:
  subject_and_text_ciphertext_in_mail_tx: true
  encrypted_attachment_descriptors_inside_message: beta_only
  per_mail_permanent_consensus_state: false
