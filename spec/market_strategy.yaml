version: '0.0.1'
positioning:
  en: CYBOU — a European sovereign identity and communication network, designed in France.
  fr: CYBOU — réseau européen souverain d'identité et de communication, conçu en France.
ownership:
  commercial_owner_operator: true
  dao: false
  foundation: false
  operational_decentralization: true
rollout:
- phase: France
  purpose: R&D, native Email pilot, operational proof
- phase: European Union
  purpose: multi-country approved-validator operation and cross-border pilots
- phase: Global
  purpose: later commercial expansion after EU maturity
go_to_market:
  first_product: CYBOU Email
  product_thesis: Identity is the platform primitive; Email is the first product.
  first_adoption_unit: organization/team
  isolated_consumer_launch: false
  later_services:
  - Object Storage
  - Backup
  - Drive
  service_expansion_requires_product_gates: true
  initial_public_channels: false
  lead_message:
  - sovereign E2E encrypted email
  - consensus registration/finality
  - network-native identity
  - operational resilience
  - European independence
  - user-controlled network identity
  do_not_lead_with:
  - blockchain
  - coin
  - staking
  - UTXO
  pq_positioning: security_property_not_sole_differentiator
  native_asset_positioning: infrastructure_not_prerequisite_purchase
asset:
  ico: false
  public_sale: false
  exchange_listing_objective: false
compliance_gates:
- CRA readiness
- French cryptography/export review
- Email communications-service regulatory review
- GDPR/privacy review
- MiCA review before public economic launch
