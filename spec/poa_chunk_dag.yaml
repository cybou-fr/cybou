version: '0.0.1'
status: frozen_architecture_target_protocol_parameters_open
activation: coordinated_DEV_cutover_after_all_gates
consensus:
  mode: genesis_bound_single_operator_PoA
  bft: removed_at_cutover
  validator_set: absent
  unfinalized_operations: local_origin_and_finalizer_only
  full_nodes_recompute_state: true
  finality_is_BFT: false
  poa_signature:
    roles_required: [Ed25519, ML-DSA-65]
    classical_only_fallback: false
    key_source: operator_mnemonic_dedicated_domain
    private_key_persisted: false
  anti_equivocation_journal:
    durable_before_signing: true
    stores_private_key: false
  open_cutover_gates:
    - deterministic_conflicting_signature_and_fork_handling
    - journal_rollback_and_operator_recovery
    - canonical_signature_and_genesis_vectors
operations:
  application_operation_types: absent
  generic_publication: RootPublication
  recipient_account_id_public: false
  generic_byte_fees: required
  mail_specific_consensus_quotas: absent
chunks:
  id: full_256_bit_BLAKE3_of_stored_encrypted_bytes
  crypto: ChaCha20-Poly1305
  key_derivation: HKDF-SHA256
  identity_kem: X-Wing_draft_05_DEV
  payload: bounded_canonical_CBOR_plus_random_padding
  object_id_and_chunk_index_on_network: false
  application_graph_metadata_encrypted: true
  b3_implementation: vetted_external_implementation
  canonical_cbor:
    deterministic_encoding: RFC8949_core_deterministic
    allowed_types: [unsigned_integer, negative_integer, byte_string, utf8_text, array, map, boolean, null]
    forbidden_types: [indefinite_length, tag, floating_point, undefined, unassigned_simple]
    map_key_order: bytewise_lexicographic_of_encoded_key
    max_encoded_bytes: 262144
    max_string_bytes: 262144
    max_container_items: 4096
    max_total_items: 16384
    max_nesting_depth: 32
    text_encoding: strict_UTF8
  encrypted_chunk:
    envelope_magic: CYCH
    envelope_version: 1
    header_fields: [magic_4, version_1, node_key_salt_32, nonce_12]
    header_bytes: 49
    aead: ChaCha20-Poly1305
    graph_content_key_bytes: 32
    graph_content_key_scope: one_immutable_graph_version
    graph_content_key_generation: OpenSSL_CSPRNG
    node_key_kdf: HKDF-SHA256
    node_key_kdf_salt: random_32_bytes_per_node
    node_key_kdf_info: "CYBOU/CHUNK-KEY/v1 || NetworkID"
    nonce: random_12_bytes_per_node
    associated_data: "CYBOU/CHUNK-AAD/v1 || header || NetworkID"
    plaintext_frame: uint32_be_cbor_length || canonical_cbor || random_padding
    padding_bucket_bytes: [1024, 4096, 16384, 65536, 262144, 524288]
    padding_bucket_selection: smallest_bucket_fitting_frame
    aead_tag_bytes: 16
    max_stored_bytes: 524353
    chunk_id_covers: entire_stored_envelope
  encrypted_graph:
    private_node_schema_version: 1
    node_map_keys: [schema_version, kind, declared_plaintext_bytes, payload_or_child_ids]
    node_kind_values: {leaf: 0, branch: 1}
    leaf_payload_type: byte_string
    branch_child_id_type: 32_byte_ChunkID
    leaf_bytes_max: 184320
    branch_children_min: 2
    branch_children_max: 128
    graph_chunks_max: 65536
    graph_depth_max_nodes: 16
    graph_plaintext_bytes_max: 268435456
    empty_payload_representation: empty_leaf
    chunk_order: child_array_order
    duplicate_chunk_references: rejected
  chunk_authorization:
    hash: BLAKE3-256
    leaf_preimage: "CYBOU/CHUNK-AUTH/LEAF || ChunkID || stored_size_u64be"
    leaf_order: ascending_ChunkID_bytes
    node_preimage: "CYBOU/CHUNK-AUTH/NODE || left_hash || right_hash"
    odd_node_rule: duplicate_last
    empty_tree: rejected
    maximum_leaf_count: 2048
    inclusion_proof_sibling_order: leaf_to_root
    inclusion_proof_max_siblings: 11
  open_gates:
    - encrypted_chunk_cross_implementation_vectors
    - encrypted_graph_cross_implementation_vectors_and_limits
    - chunk_authorization_merkle_cross_implementation_vectors
    - padding_overhead_benchmarks
    - official_KAT_and_cross_implementation_vectors
publication:
  wire_profile: 1
  canonical_encoding: RFC8949_core_deterministic_CBOR_map_integer_keys_ascending
  fields: [wire_version, root_chunk_id, chunk_authorization_root, chunk_count, authorized_stored_bytes, recipient_capsules]
  body_max_bytes: 131072
  full_operation_max_bytes: 147456
  chunk_count_min: 1
  chunk_count_max: 2048
  authorized_stored_bytes_min_per_chunk: 1089
  authorized_stored_bytes_max: 536870912
  recipient_capsule_count_min: 1
  recipient_capsule_count_max: 64
  recipient_count_padding: none
  recipient_count_leakage: accepted
  capsule_fields: [kem_profile_u16, recipient_key_epoch_u64, package_commitment_32, xwing_draft05_enc_1120, wrapped_graph_key_60]
  capsule_kem_profile: 0x647a
  capsule_wrapped_graph_key: nonce_12 || ciphertext_32 || tag_16
  capsule_kdf: HKDF-SHA256
  capsule_kdf_input: XWing_shared_secret
  capsule_kdf_salt: NetworkID_32
  capsule_kdf_info: "CYBOU/ROOT-CAPSULE-KEY/v1 || root_chunk_id || sender_account_id || sender_nonce_u64be || sender_key_epoch_u64be || recipient_key_epoch_u64be || package_commitment"
  capsule_aead: ChaCha20-Poly1305
  capsule_aad: "CYBOU/ROOT-CAPSULE-AAD/v1 || NetworkID || root_chunk_id || sender_account_id || sender_nonce_u64be || sender_key_epoch_u64be || recipient_key_epoch_u64be || package_commitment"
  operation_fee: "4 * ceil(full_canonical_operation_bytes / 1024)"
  priority_fee: disabled
  fee_split: {security: 3, onboarding: 1}
  capsule_contains_public_recipient: false
  capsule_count_public: true
  capsule_count_privacy_treatment: OPEN_PAD_OR_ACCEPT_LEAKAGE
  mail_files_backup_consensus_types: absent
  finality_authorizes_storage: true
  finality_proves_durability: false
storage:
  address: ChunkID
  admission_requires_finalized_publication: true
  proof: domain_separated_Merkle_inclusion
  operations: [PUT_CHUNK, GET_CHUNK, optional_HAS_CHUNK]
  manifest_commit_staging_abort_protocol: absent_after_cutover
  chunk_placement: independent_per_chunk
  open_gates:
    - canonical_merkle_encoding_and_vectors
    - durability_threshold_and_retry_semantics
    - retention_repair_accounting_and_provider_loss
recovery:
  publication_scanner: local_rebuildable_index
  clean_machine_requires_prior_client_database: false
  restore_and_recursive_fetch_acceptance_required: true
