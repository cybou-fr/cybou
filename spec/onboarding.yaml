status: CURRENT
scope: Treasury_funded_account_creation_and_local_capacity
reviewed_revision: 787e18ca
sources:
  - docs/cybou/18_ECONOMICS_FEES.md
  - src/cybou/protocol_params.h
  - src/cybou/state.cpp

onboarding:
  automatic: true
  invitation_required: false
  operator_approval_required: false

economics:
  onboarding_bonus: 20000
  source: CentralTreasury
  destination: SystemBalance
  origin_tracked: onboarding_system_balance
  treasury_claimant_bonus: false
  minted: false

account_creation:
  operation: AccountCreateOp

  work:
    required: true
    profile: ACCOUNT_CREATION_WORK
    target: protocol_parameter

storage_onboarding:
  remote_storage: paid_storage_lease  # DEC-274
  local_capacity_min_bytes: 16106127360  # 15 GiB explicit local capacity

anti_sybil:
  account_creation_work: true
  account_id_uniqueness: true
  per_identity_operation_tiers: absent
  max_account_creates_per_block: 100
  limit_scope: global_block_limit
