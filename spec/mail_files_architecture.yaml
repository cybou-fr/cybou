version: '0.1'
status: architecture_target
scope: mail_files_private_application_layer

identity:
  scope: account
  device_is_protocol_entity: false

local_data_plane:
  common_chunk_store:
    encrypted_bytes_only: true
    semantic_ownership: false
    own_foreign_classification: false
    gui_enumeration: false

  identity_application_db:
    per_identity: true
    encrypted_at_rest: true
    rebuildable: true
    gui_semantic_source: true
    foreign_provider_chunks_visible: false

services:
  application_service:
    responsibilities:
      - scan_finalized_root_publications
      - open_identity_capsules
      - decrypt_private_roots
      - rebuild_mail_files_projection
  publication_service:
    responsibilities:
      - local_encryption_and_staging
      - root_publication_construction
      - self_and_recipient_capsules
      - finality_reconciliation
  storage_service:
    responsibilities:
      - get_put_chunks
      - provider_selection
      - remote_replication
      - health_audit_repair

publication:
  generic_bundle_is_wire_entity: false
  multiple_private_trees_per_root_publication: true
  one_global_chunk_authorization_root: true
  root_publication_root_is_main_private_root: true
  child_root_ids_and_keys_private_inside_main_root: true
  self_capsule_required_for_recoverable_owner_content: true
  unfinalized_remote_storage: false

mail:
  recipients_initial: 1
  sender_truth: outer_identity_authorization
  private_schema:
    - message_id
    - optional_reply_to_message_id
    - recipient_account_id
    - timestamp
    - subject
    - body
    - attachments
  attachments_reuse_existing_protected_content: true
  sent_requires_remote_durability: true

files:
  catalog_model: ordered_private_mutation_journal
  consensus_catalog_state: false
  mutations:
    - upsert_item
    - delete_item
  local_only_views:
    - starred
    - recent
    - view_mode
    - access_history
  file_content_requires_separate_application_schema: false

content_lifecycle:
  - local
  - preparing
  - waiting_for_confirmation
  - securing
  - protected

storage:
  local_copy:
    encrypted: true
    counts_as_remote_replica: false
  development_remote_full_replicas: 1
  beta_remote_full_replicas: 2
  erasure_coding_beta: false
  placement_granularity: chunk_id
  replica_identity: provider_id  # BLAKE3 of the CYP2-proven provider key
  deterministic_provider_ranking_frozen: false
  provider_discovery_initial: peer_fanout_by_chunk_id
  repair_required: true

recovery:
  application_db_required: false
  old_provider_placement_db_required: false
  current_mnemonic_plus_public_history: true
  historical_kem_recovery_after_rotation: recovery_bridge
  self_capsule_for_owner_recovery: true
