version: '0.14'
domains:
  operator_authority:
    purposes:
    - validator_admission
    - validator_removal
    - invite_voucher_authorization
    - enumerated_operator_actions
    target_custody: 2_of_3
  operator_validator:
    purposes:
    - BFT_votes
  release_signing:
    purposes:
    - official_release_authenticity
  treasury:
    purposes:
    - company_owned_cybou
object_signing_domains:
  invite_voucher: REQUIRED_BEFORE_CONSENSUS
  validator_admission: REQUIRED_BEFORE_CONSENSUS
  validator_removal: REQUIRED_BEFORE_CONSENSUS
  protocol_parameter_action: REQUIRED_BEFORE_CONSENSUS
operator_authority_signature_suite:
  status: OPEN
  candidate: HYBRID_ED25519_ML_DSA_65_BOTH_REQUIRED
