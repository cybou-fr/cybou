version: '0.0.1'
domains:
  operator_authority:
    purposes:
    - validator_admission
    - validator_removal
    - protocol_parameter_action
    - enumerated_operator_actions
    target_custody: 2_of_3
  operator_validator:
    purposes:
    - BFT_votes
  release_signing:
    purposes:
    - official_release_authenticity
  treasury:
    purposes:
    - company_owned_cybou
object_signing_domains:
  validator_admission: CYBOU/SIG/VALIDATOR-ADMISSION/V1
  validator_removal: CYBOU/SIG/VALIDATOR-REMOVAL/V1
  protocol_parameter_action: CYBOU/SIG/PROTOCOL-PARAMETER/V1
operator_authority_signature_suite:
  status: FROZEN_V0_0_3_1
  suite_id: HYBRID_ED25519_MLDSA65_V1
  algorithms:
    classical: Ed25519
    post_quantum: ML-DSA-65
  combination_rule: BOTH_SIGNATURES_REQUIRED_AND
  canonical_bytes_required: true
  caller_supplied_signature_boolean_allowed_in_consensus: false
  crypto_verification_status: PRIMITIVE_VERIFIER_IMPLEMENTED_CONSENSUS_OPERATION_WIRING_PENDING
  keyset:
    identifier: hash32
    ed25519_public_key_bytes: 32
    mldsa65_public_key_bytes: 1952
    rotation: epoch_windowed_historical_keysets_retained
forbidden_cross_domain_powers:
- decrypt_user_mail
- arbitrary_user_balance_debit
- forge_user_signature
- participate_in_ordinary_account_creation_or_onboarding
invariants:
- "Operator Authority MUST NOT participate in ordinary AccountID creation or onboarding."
