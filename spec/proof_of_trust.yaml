version: '0.2'
status: informational_policy

authority:
  canonical_state_field: false
  derived_from_finalized_history: true
  transferable: false
  resource_allocation: false
  poa_power: false
  monetary_reward_or_penalty: false

validation:
  optional: true
  advisory_only: true
  any_full_node_may_sign: true
  canonical: false
  changes_state_or_finality: false
  authorizes_remote_storage: false
  recipient_qualifies_signer_at_authority: 1000000
  threshold_is_protocol_admission: false

excluded_protocol_mechanisms:
  validator_set: false
  validator_registry: false
  node_id_binding: false
  liveness_or_storage_evidence: false
  resource_budgets_or_reservations: false
  tickets_or_per_io_accounting: false
  rewards_or_penalties: false

finality:
  current_model: single_genesis_bound_operator_poa
  full_nodes_independently_validate: true
  validation_replaces_poa: false
