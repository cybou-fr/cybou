version: '0.0.1'
full_node:
  type: Full_Node
  cyp2_version: 5
  hello_fields: [network_binding, finalized_height, finalized_tip, nonce]
  capability_bitmap: absent
  network_role_announcement: absent
  baseline: [block_sync, announcements, discovery, operation_relay, Validation_transport, encrypted_storage]
  storage: intrinsic_local_quota_may_be_zero
  storage_identity: on_demand_TLS_bound_challenge_proof_for_storage_only
  poa_authority: genesis_key_possession_proved_by_block_certificates
  signer_activation_reconnects_peers: false
  peer_sync_completion: advisory_not_global_freshness
  identity_creation_requires_peer_sync_completion: false
status: active_protocol_architecture
consensus:
  mode: genesis_authorized_single_operator_PoA
  network_identity:
    network_id: network_public_key
    genesis: immutable
    genesis_replacement: forbidden
    runtime_input: VerifiedNetworkGenesis
    chain_height_zero_tip: verified_signed_genesis_specification_digest
    synthetic_genesis_block_id: absent
    official_public_data: compiled_network_public_key_signed_genesis_initial_state_bootstrap_locators
    external_official_network_file: absent
    separate_genesis_digest_profile_pin: absent
  poa_public_key: genesis_authorized
  poa_identity: ordinary_cybou_dot_cybou_identity_with_distinct_poa_key_role
  authority_assignment: genesis_allocation_claimed_once_into_canonical_account_AUTH
  authority_state_field: AccountState.authority
  authority_unit: AUTH
  bft: false
  validator_set: absent
  validation:
    role: optional_prefinalization_signatures
    requires_local_independent_execution: true
    receivers_reexecute: true
    poa_reexecutes: true
    creates_state: false
    minimum_authority_for_eligibility: 1000001
    authority_evaluation_state: latest_finalized_state
    signed_fields: [network_binding, operation_id, finalized_base_block_id, validator_account_id]
    signature: identity_authorization_ed25519_mldsa44
  bootstrap:
    role: ordinary_cybou_full_peer
    same_executable: true
    same_protocol: CYP2
    auth_from_role: false
    special_consensus_role: absent
  unfinalized_operations: local_origin_bounded_volatile_peer_relay
  full_nodes_recompute_state: true
  finality_is_BFT: false
  poa_signature:
    roles_required: [Ed25519, ML-DSA-65]
    classical_only_fallback: false
    key_source: operator_mnemonic_dedicated_domain
    private_key_persisted: false
  anti_equivocation_journal:
    durable_before_signing: true
    stores_private_key: false
  open_cutover_gates:
    - deterministic_conflicting_signature_and_fork_handling
    - journal_rollback_and_operator_recovery
    - canonical_signature_and_genesis_vectors
operations:
  application_operation_types: absent
  generic_publication: RootPublication
  recipient_account_id_public: false
  generic_byte_fees: required
  mail_specific_consensus_quotas: absent
chunks:
  id: full_256_bit_BLAKE3_of_stored_encrypted_bytes
  crypto: ChaCha20-Poly1305
  key_derivation: HKDF-SHA256
  identity_kem: X-Wing_draft_05_DEV
  payload: encrypted_ordered_ROOT_INDEX_DATA_tree
  object_id_and_chunk_index_on_network: false
  application_graph_metadata_encrypted: true
  b3_implementation: vetted_external_implementation
  binary_codec:
    integers: little_endian
    fixed_ids_bytes: 32
    length_prefix: u32_LE
    optional_presence: strict_u8_0_or_1
    text_encoding: strict_UTF8
    exact_input_consumption: true
    unknown_versions: rejected
    generic_recursive_parser: absent
  encrypted_chunk:
    envelope_magic: CYCH
    envelope_version: 1
    header_fields: [magic_4, version_1, node_key_salt_32, nonce_12]
    header_bytes: 49
    aead: ChaCha20-Poly1305
    content_key_bytes: 32
    content_key_scope: one_immutable_tree_version
    content_key_generation: OpenSSL_CSPRNG
    node_key_kdf: HKDF-SHA256
    node_key_kdf_salt: random_32_bytes_per_node
    node_key_kdf_info: "CYBOU/CHUNK-KEY/v1 || NetworkID"
    nonce: random_12_bytes_per_node
    associated_data: "CYBOU/CHUNK-AAD/v1 || header || NetworkID"
    plaintext_frame: uint32_be_plaintext_length || plaintext_bytes || random_padding
    padding_bucket_bytes: [1024, 4096, 16384, 65536, 262144, 524288]
    plaintext_max_bytes: 524284
    random_extra_padding_max_bytes: 262144
    padding_bucket_selection: random_smallest_or_next_if_extra_within_limit
    aead_tag_bytes: 16
    max_stored_bytes: 524353
    chunk_id_covers: entire_stored_envelope
  encrypted_tree:
    metadata_encoding: fixed_order_binary_schema_3_ROOT_INDEX
    data_encoding: raw_application_bytes
    structure: ROOT_to_DATA_or_zero_or_more_INDEX_levels_to_DATA
    root_uses_index_only_when_child_list_exceeds_root_fanout: true
    metadata_fields: [schema_version, kind, child_kind, ordered_ChunkIDs, root_private_metadata_for_ROOT]
    child_fields: [ChunkID]
    kind_values: {root: 0, index: 1, data: 2}
    data_chunk_plaintext_bytes: {actual_min: 0, target_random_range: [163840, 327680], max: 524284}
    index_children_max: 128
    root_children_max: 128
    root_private_metadata_max_bytes: 245760
    tree_depth_max_nodes: 32
    chunk_count_max: 1048576  # MAX_PUBLICATION_CHUNKS, shared by consensus and storage
    per_file_256MiB_cap: absent
    chunk_boundaries: cryptographically_randomized
    empty_payload_representation: ROOT_with_zero_children
    child_order: array_order
    cycles: rejected
  chunk_authorization:
    hash: BLAKE3-256
    leaf_preimage: "CYBOU/CHUNK-AUTH/LEAF || ChunkID"
    leaf_order: exact_durable_builder_staging_order_data_source_order_interleaved_with_generated_indexes_root_last
    node_preimage: "CYBOU/CHUNK-AUTH/NODE || left_hash || right_hash"
    odd_node_rule: duplicate_last
    empty_tree: rejected
    maximum_leaf_count: 1048576  # MAX_PUBLICATION_CHUNKS
    inclusion_proof_fields: [leaf_index_u32, sibling_hashes]
    inclusion_proof_sibling_order: leaf_to_root
    inclusion_proof_max_siblings: 32

    test_vector_root_3_chunks: "957fe7e324d7a8e3c69d84d20f1294ee6a406c8e3dc92b151607708cd6395c4e"
  open_gates:
    - encrypted_chunk_cross_implementation_vectors
    - encrypted_tree_cross_implementation_vectors_and_limits
    - chunk_authorization_merkle_cross_implementation_vectors
    - padding_overhead_benchmarks
    - typed_binary_schema_cross_implementation_vectors
    - root_capsule_wrap_unwrap_vectors_and_recipient_recovery
    - root_publication_client_construction_and_history_scanner
publication:
  wire_profile: 4
  canonical_encoding: fixed_order_binary_LE_strict_exact_consumption
  fields: [wire_version, root_chunk_id, chunk_authorization_root, chunk_count, recipient_capsules]
  body_max_bytes: 131072
  full_operation_max_bytes: 147456
  authorized_chunk_set_public: false
  authorized_chunk_set_encoding: absent
  chunk_count_min: 1
  chunk_count_max: 1048576  # MAX_PUBLICATION_CHUNKS, shared by consensus and storage
  recipient_capsule_count_min: 1
  recipient_capsule_count_max: 32
  recipient_count_padding: none
  recipient_count_leakage: accepted
  capsule_fields: [kem_profile_u16, recipient_key_epoch_u64, xwing_draft05_enc_1120, wrapped_content_key_60]
  capsule_kem_profile: 0x647a
  capsule_wrapped_content_key: nonce_12 || ciphertext_32 || tag_16
  capsule_kdf: HKDF-SHA256
  capsule_kdf_input: XWing_shared_secret
  capsule_kdf_salt: NetworkID
  capsule_kdf_info: "CYBOU/ROOT-CAPSULE-KEY/v1 || root_chunk_id || sender_account_id || sender_nonce_u64be || sender_key_epoch_u64be || recipient_key_epoch_u64be"
  capsule_aead: ChaCha20-Poly1305
  capsule_aad: "CYBOU/ROOT-CAPSULE-AAD/v1 || NetworkID || root_chunk_id || sender_account_id || sender_nonce_u64be || sender_key_epoch_u64be || recipient_key_epoch_u64be"
  operation_fee: "4 * ceil(full_canonical_operation_bytes / 1024) + 4 * chunk_count"
  priority_fee: disabled
  fee_split: {security: 3, onboarding: 1}
  capsule_contains_public_recipient: false
  capsule_count_public: true
  capsule_count_privacy_treatment: ACCEPT_LEAKAGE
  mail_files_backup_consensus_types: absent
  finality_authorizes_storage: true
  finality_proves_durability: false
storage:
  address: ChunkID
  admission_policy_default: finality_first
  validation_authorizes_admission: false
  proof: domain_separated_Merkle_inclusion
  durability_targets:
    development: 1_remote_full_replica
    beta: 2_independent_remote_full_replicas_plus_local_copy_equals_3_physical_copies
  operations: [PUT_CHUNK, GET_CHUNK, optional_HAS_CHUNK]
  manifest_commit_staging_abort_protocol: absent
  chunk_placement: independent_per_chunk
  open_gates:
    - provider_chunk_wire_serialization_and_admission_integration
    - durability_threshold_and_retry_semantics
    - retention_repair_accounting_and_provider_loss
recovery:
  publication_scanner: local_rebuildable_index
  clean_machine_requires_prior_client_database: false
  restore_and_recursive_fetch_acceptance_required: true

hash_values:
  type: CYBOU_Hash256
  bytes: 32
  opaque: true
  serialization: raw_canonical_byte_order
  comparison: lexicographic_raw_bytes
  hex: forward_byte_order_64_digits_lowercase_output
  parse_prefix_or_padding: rejected
transport:
  message_ids: compact_1_through_26
  block_sync: GET_BLOCKS_META_DATA_END_consecutive_batched
  maximum_blocks_per_batch: 32
  operation_transfer: shared_OP_META_OP_DATA_OP_RESULT
  configured_peers: ordered_endpoint_optional_TLS_pin_vector
  discovered_peers: separate_bounded_cache
local_publication:
  staging: direct_PublicationService_pinned_ChunkBlobStore
  authorization_leaf_list: saved_once_in_encrypted_Application_DB
  merkle_levels: transient_O_N
  proof_generation: per_chunk_O_log_N
  persisted_proof_index: absent
private_application_schema:
  version: 3
  encoding: typed_fixed_order_binary
  types: {Mail: 1, Files: 2, RecoveryBridge: 3}
