    fixed_ids_bytes: 32
    length_prefix: u32_LE
    optional_presence: strict_u8_0_or_1
    text_encoding: strict_UTF8
    exact_input_consumption: true
    unknown_types: rejected
    generic_recursive_parser: absent
  encrypted_chunk:
    envelope_magic: CYCH
    header_fields: [magic_4, node_key_salt_32, nonce_12]
    header_bytes: 48
    aead: ChaCha20-Poly1305
    content_key_bytes: 32
    content_key_scope: one_immutable_tree
    content_key_generation: OpenSSL_CSPRNG
    node_key_kdf: HKDF-SHA256
    node_key_kdf_salt: random_32_bytes_per_node
    node_key_kdf_info: "CYBOU/CHUNK-KEY || NetworkID"
    nonce: random_12_bytes_per_node
    associated_data: "CYBOU/CHUNK-AAD || header || NetworkID"
    plaintext_frame: uint32_be_plaintext_length || plaintext_bytes || random_padding
    padding_bucket_bytes: [1024, 4096, 16384, 65536, 262144, 524288]
    plaintext_max_bytes: 524284
    random_extra_padding_max_bytes: 262144
    padding_bucket_selection: random_smallest_or_next_if_extra_within_limit
    aead_tag_bytes: 16
    max_stored_bytes: 524352
    chunk_id_covers: entire_stored_envelope
  encrypted_tree:
    metadata_encoding: fixed_order_binary_schema_ROOT_INDEX
    data_encoding: raw_application_bytes
    structure: ROOT_to_DATA_or_zero_or_more_INDEX_levels_to_DATA
    root_uses_index_only_when_child_list_exceeds_root_fanout: true
    metadata_fields: [kind, child_kind, ordered_ChunkIDs, root_private_metadata_for_ROOT]
    child_fields: [ChunkID]
    kind_values: {root: 0, index: 1, data: 2}
    data_chunk_plaintext_bytes: {actual_min: 0, target_random_range: [163840, 327680], max: 524284}
    index_children_max: 128
    root_children_max: 128
    root_private_metadata_max_bytes: 245760
    tree_depth_max_nodes: 32
    chunk_count_max: 1048576  # MAX_PUBLICATION_CHUNKS, shared by consensus and storage
    per_file_256MiB_cap: absent
    chunk_boundaries: cryptographically_randomized
    empty_payload_representation: ROOT_with_zero_children
    child_order: array_order
    cycles: rejected
  chunk_authorization:
    hash: BLAKE3-256
    leaf_preimage: "CYBOU/CHUNK-AUTH/LEAF || ChunkID"
    leaf_order: exact_durable_builder_staging_order_data_source_order_interleaved_with_generated_indexes_root_last
    node_preimage: "CYBOU/CHUNK-AUTH/NODE || left_hash || right_hash"
    odd_node_rule: duplicate_last
    empty_tree: rejected
    maximum_leaf_count: 1048576  # MAX_PUBLICATION_CHUNKS
    inclusion_proof_fields: [leaf_index_u32, sibling_hashes]
    inclusion_proof_sibling_order: leaf_to_root
    inclusion_proof_max_siblings: 32

    test_vector_root_3_chunks: "957fe7e324d7a8e3c69d84d20f1294ee6a406c8e3dc92b151607708cd6395c4e"
