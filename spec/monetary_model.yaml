
asset:
  symbol: CYBOU
  max_supply: absent  # genesis monetary base 100000000000, conserved (DEC-277)
  genesis_monetary_base: 100000000000
  decimals: 0
  minimum_unit: 1
  perpetual_emission: false

genesis:  # storage economy (DEC-277); the deployed pre-M7 DEVNET still runs the superseded pool model
  central_authority_genesis_allocation:
    balance: 100000000000
    authority: 10000001
    name: cybou
  bootstrap_genesis_allocation:
    balance: 0
    authority: 10000001
    name: bootstrap
  issued_supply: 100000000000
  unissued_supply: 0
  official_provisioning: new_devnet_at_m7

onboarding_bonus:
  onboarding_bonus: 20000
  source: CentralTreasury
  destination: SystemBalance
  minted: false

balances:
  Balance:
    unit: CYBOU
    transferable: true
  SystemBalance:
    unit: CYBOU
    transferable: false
    reversible_to_balance: false
    pays_protocol_services: true
  Authority:
    unit: AUTH
    transferable: false
    canonical_state: AccountState.authority
    fixed_supply: false
    included_in_cybou_supply: false
    validation_threshold_exclusive: 10000000
    poa_power: false

auth:
  validation_threshold_exclusive: 10000000
  genesis_allocation: true
  finalized_identity_operation_reward: 1
  account_create_rewarded: false
  poa_adjustment_operation: PoaAuthAdjustment
  poa_adjustment_actions: [GRANT, BURN]
  poa_adjustment_rewarded: false
  burn_floor: 0
  transfer: false
  automatic_penalties: not_frozen

cybou_supply:
  conservation: exact_per_block
  includes: [Balance, SystemBalance, StorageEscrow, unclaimed_genesis_allocation_balances]
  excludes: [Authority]

fees:
  source: SystemBalance
  destination: CentralAuthorityBalance
  recipient: unique_genesis_allocation_label_cybou
  before_claim: genesis_allocation_balance
  after_claim: claimant_account_balance
  percent: 100
  onboarding_percent: 0
  priority_fee: false
  burn_fraction: 0
  batching: false
  validator_rewards: false
  storage_rewards: false  # storage rent is not a fee: StorageEscrow -> providers
  atomic: true

application_content:
  mail_specific_consensus_fee_model: false
  file_specific_consensus_fee_model: false
  generic_root_publication_fee_model: true

storage_economy_target:  # DEC-274..DEC-283; frozen target, not implemented
  status: implemented_m5_active_from_m7_genesis
  max_supply: absent
  onboarding_pool: absent
  mint: false
  burn: false
  genesis_monetary_base: 100000000000
  genesis_monetary_base_holder: cybou_treasury_allocation
  conservation: TotalCybou_parent_equals_candidate
  total_cybou_includes: [unclaimed_genesis_allocation_balances, Balance, SystemBalance, StorageEscrow]
  onboarding_bonus: 20000
  onboarding_source: Treasury
  onboarding_destination: SystemBalance
  onboarding_origin_transferable_via_storage: false
  protocol_fees_destination: Treasury
  storage_rent_destination: StorageEscrow_then_verified_providers
  storage_rent_provider_percent: 100
  storage_rate_cybou_per_gib_day_replica: 5
  storage_billing_unit_bytes: 524288
  storage_replica_target: 2
  storage_settlement_period_seconds: 86400
  lease_refund_destination: SystemBalance
  stake: false
  slashing: false
