[lab]
name = "local-lab"
duration_seconds = 1800
run_dir = "/tmp/cybou-lab-controller"

[hosts.local]
type = "local"
root = "/tmp/cybou-lab-nodes"
binary = "/absolute/path/to/build/bin/cybou"
python = "python3"
loadgen_binary = "/absolute/path/to/build/bin/cybou-loadgen"

[loadgen]
host = "local"
peer = "127.0.0.1:30461"
profile = "files"
identities = 2
file_size = "1MiB"
operations_per_second = 1
max_operations = 32
replicas = 2

[[nodes]]
name = "finalizer"
host = "local"
role = "finalizer"
listen = "127.0.0.1:30461"
block_interval = "500ms"

[[nodes]]
name = "provider-a"
host = "local"
role = "provider"
listen = "127.0.0.1:30471"
peer = "127.0.0.1:30461"
capacity = "1GiB"

[[nodes]]
name = "provider-b"
host = "local"
role = "provider"
listen = "127.0.0.1:30481"
peer = "127.0.0.1:30461"
capacity = "1GiB"

[[nodes]]
name = "provider-c"
host = "local"
role = "provider"
listen = "127.0.0.1:30482"
peer = "127.0.0.1:30461"
capacity = "1GiB"

[[nodes]]
name = "observer"
host = "local"
role = "observer"
listen = "127.0.0.1:30491"
peer = "127.0.0.1:30461"
