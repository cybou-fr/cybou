name: CYBOU core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cybou-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cybou-unit:
    name: CYBOU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            libboost-dev \
            libevent-dev \
            ninja-build \
            pkgconf \
            python3

      - name: Prepare OpenSSL directory
        run: sudo mkdir -p /opt/openssl-3.5 && sudo chown -R $USER:$USER /opt/openssl-3.5

      - name: Cache OpenSSL 3.5
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /opt/openssl-3.5
          key: openssl-3.5.0-ubuntu-24.04

      - name: Build and install OpenSSL 3.5
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz -o openssl-3.5.0.tar.gz
          tar -xzf openssl-3.5.0.tar.gz
          cd openssl-3.5.0
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 no-tests no-docs
          make -j$(nproc)
          make install_sw

      - name: Configure headless unit build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g0" \
            -DOPENSSL_ROOT_DIR=/opt/openssl-3.5 \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DENABLE_EXTERNAL_SIGNER=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_CCACHE=OFF \
            -DWITH_ZMQ=OFF

      - name: Build CYBOU core test and node binaries
        run: cmake --build build-ci --target cybou-core-test cybou-node --parallel 2

      - name: Run CYBOU protocol tests
        run: |
          build-ci/bin/cybou-core-test --log_level=error

      - name: Smoke test cybou-node
        run: |
          python3 -c "import os; open('/tmp/val.key', 'wb').write(os.urandom(32))"
          build-ci/bin/cybou-node init-dev /tmp/net.def /tmp/val.key
          test -f /tmp/net.def
          build-ci/bin/cybou-node serve /tmp/net.def /tmp/cybou-producer /tmp/val.key 127.0.0.1 29460 100 &
          producer_pid=$!
          trap 'kill "$producer_pid" 2>/dev/null || true' EXIT
          build-ci/bin/cybou-node sync /tmp/net.def /tmp/cybou-observer 127.0.0.1 29460 1

      - name: Four-process BFT smoke test
        run: |
          python3 test/cybou_four_process_smoke.py build-ci/bin/cybou-node
