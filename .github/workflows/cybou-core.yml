name: CYBOU core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cybou-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cybou-unit:
    name: CYBOU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            libboost-dev \
            libevent-dev \
            ninja-build \
            pkgconf \
            python3

      - name: Prepare OpenSSL directory
        run: sudo mkdir -p /opt/openssl-3.5 && sudo chown -R $USER:$USER /opt/openssl-3.5

      - name: Cache OpenSSL 3.5
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: /opt/openssl-3.5
          key: openssl-3.5.0-ubuntu-24.04

      - name: Build and install OpenSSL 3.5
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl -sSL https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz -o openssl-3.5.0.tar.gz
          tar -xzf openssl-3.5.0.tar.gz
          cd openssl-3.5.0
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 no-tests no-docs
          make -j$(nproc)
          make install_sw

      - name: Configure headless unit build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g0" \
            -DOPENSSL_ROOT_DIR=/opt/openssl-3.5 \
            -DBUILD_BITCOIN_BIN=OFF \
            -DBUILD_DAEMON=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_CLI=OFF \
            -DBUILD_TESTS=ON \
            -DBUILD_TX=OFF \
            -DBUILD_UTIL=OFF \
            -DENABLE_WALLET=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF \
            -DENABLE_IPC=OFF \
            -DWITH_CCACHE=OFF \
            -DWITH_ZMQ=OFF

      - name: Build CYBOU core test and node binaries
        run: cmake --build build-ci --target cybou-core-test cybou-node --parallel 2

      - name: Run CYBOU protocol tests
        run: |
          build-ci/bin/cybou-core-test \
            --run_test=cybou_chainparams_tests,cybou_signing_tests,cybou_identity_tests,cybou_account_creation_tests,cybou_protocol_operation_tests,cybou_state_tests,cybou_state_store_tests,cybou_authority_node_tests,cybou_bft_tests,cybou_evidence_tests,cybou_mail_filter_tests,cybou_node_runtime_tests \
            --log_level=error

      - name: Smoke test cybou-node
        run: |
          python3 -c "import os; open('/tmp/val.key', 'wb').write(os.urandom(32))"
          VAL_PUB=$(build-ci/bin/cybou-node pubkey /tmp/val.key)
          test -n "$VAL_PUB"
          echo "Derived validator public key: $VAL_PUB"
          build-ci/bin/cybou-node init-dev /tmp/net.def "$VAL_PUB"
          test -f /tmp/net.def
          echo "Successfully initialized dev network definition file"
