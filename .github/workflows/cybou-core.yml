name: CYBOU core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cybou-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cybou-unit:
    name: CYBOU unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            libboost-dev \
            libevent-dev \
            iproute2 \
            ninja-build \
            pkgconf \
            python3

      - name: Prepare OpenSSL directory
        run: sudo mkdir -p /opt/openssl-3.5 && sudo chown -R $USER:$USER /opt/openssl-3.5

      - name: Cache OpenSSL 3.5
        id: cache-openssl
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /opt/openssl-3.5
          key: openssl-3.5.0-verified-344d0a79-ubuntu-24.04

      - name: Build and install OpenSSL 3.5
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          curl --fail --location --proto =https --tlsv1.2 https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz -o openssl-3.5.0.tar.gz
          echo "344d0a79f1a9b08029b0744e2cc401a43f9c90acd1044d09a530b4885a8e9fc0  openssl-3.5.0.tar.gz" | sha256sum --check --strict
          tar -xzf openssl-3.5.0.tar.gz
          cd openssl-3.5.0
          ./config --prefix=/opt/openssl-3.5 --openssldir=/opt/openssl-3.5 no-tests no-docs
          make -j$(nproc)
          make install_sw

      - name: Build and install pinned BLAKE3
        run: |
          curl --fail --location --proto =https --tlsv1.2 https://codeload.github.com/BLAKE3-team/BLAKE3/tar.gz/ad639b126ef9b5f3b131093363cc3bb6bba4c3bf -o /tmp/blake3.tar.gz
          echo "9ad9df1d2a9c6914f2401fd1ff85a34c4d46d35c5a62f0588a8ad6bf44d7c706  /tmp/blake3.tar.gz" | sha256sum --check --strict
          mkdir /tmp/blake3
          tar -xzf /tmp/blake3.tar.gz --strip-components=1 -C /tmp/blake3
          cmake -S /tmp/blake3/c -B /tmp/blake3-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=/opt/blake3-1.8.1
          cmake --build /tmp/blake3-build --parallel 2
          sudo cmake --install /tmp/blake3-build

      - name: Configure headless unit build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS_RELWITHDEBINFO="-O2 -g0" \
            -DOPENSSL_ROOT_DIR=/opt/openssl-3.5 \
            -DCMAKE_PREFIX_PATH=/opt/blake3-1.8.1 \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DCYBOU_ENABLE_TEST_HOOKS=ON \
            -DWITH_CCACHE=OFF

      - name: Build CYBOU core test, node and smoke binaries
        run: cmake --build build-ci --target cybou-core-test cybou-node cybou-loadgen cybou-storage-smoke cybou-storage-soak --parallel 2

      - name: Run CYBOU protocol tests
        run: |
          build-ci/bin/cybou-core-test --log_level=error

      - name: Operator CLI and LAB controller acceptance
        run: |
          python3 test/cybou_operator_cli.py build-ci/bin/cybou-node
          python3 test/stress/test_controller.py
          sudo python3 test/stress/test_network_namespace.py

      - name: Smoke test cybou-node
        run: |
          umask 077
          python3 -c "import os; fd = os.open('/tmp/val.key', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600); os.write(fd, os.urandom(32)); os.close(fd)"
          build-ci/bin/cybou-node network init-dev --network /tmp/net.def --key-file /tmp/val.key
          test -f /tmp/net.def
          build-ci/bin/cybou-node finalizer run --network /tmp/net.def --data-dir /tmp/cybou-producer --key-file /tmp/val.key --listen 127.0.0.1:29461 --block-interval 100ms &
          producer_pid=$!
          trap 'kill "$producer_pid" 2>/dev/null || true' EXIT
          build-ci/bin/cybou-node network sync --network /tmp/net.def --data-dir /tmp/cybou-observer --peer 127.0.0.1:29461 --count 1

      - name: PoA finalizer + storage provider multi-process smoke
        run: |
          python3 test/cybou_storage_smoke.py build-ci/bin/cybou-node build-ci/bin/cybou-storage-smoke

      - name: Multi-process storage failure soak (Beta target, 3 providers)
        run: |
          python3 test/cybou_storage_soak.py build-ci/bin/cybou-node build-ci/bin/cybou-storage-soak
